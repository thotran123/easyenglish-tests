name: Playwright Tests

on:
  # Every push, on any branch.
  push:
  # Pull requests into main.
  pull_request:
    branches: [ main ]
  # Every day at 00:00 UTC (07:00 Vietnam time). Catches the live site breaking with no commit here.
  schedule:
    - cron: '0 0 * * *'
  # "Run workflow" button in the GitHub Actions tab.
  workflow_dispatch:

# A new push to the same branch cancels the older, still-running run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Type-check
      run: npx tsc --noEmit

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium firefox webkit

    # Google blocks sign-ins from automated browsers, so CI never signs in itself. It restores the
    # session saved on a developer's machine (secret PLAYWRIGHT_AUTH_STATE = gzip + base64 of
    # playwright/.auth/user.json). Without the secret, the signed-in tests skip.
    - name: Restore signed-in session
      env:
        AUTH_STATE: ${{ secrets.PLAYWRIGHT_AUTH_STATE }}
      run: |
        if [ -z "$AUTH_STATE" ]; then echo "No PLAYWRIGHT_AUTH_STATE secret: signed-in tests will skip."; exit 0; fi
        mkdir -p playwright/.auth
        echo "$AUTH_STATE" | base64 --decode | gunzip > playwright/.auth/user.json
    
    - name: Run Playwright tests
      run: npx playwright test

    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # Traces and screenshots from failed/retried tests (open a trace with `npx playwright show-trace <zip>`).
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: test-results/
        retention-days: 30
