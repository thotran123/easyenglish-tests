name: Playwright Tests

on:
  # Every push, on any branch.
  push:
  # Pull requests into main.
  pull_request:
    branches: [ main ]
  # Every day at 00:00 UTC (07:00 Vietnam time). Catches the live site breaking with no commit here.
  schedule:
    - cron: '0 0 * * *'
  # "Run workflow" button in the GitHub Actions tab.
  workflow_dispatch:

# A new push to the same branch cancels the older, still-running run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Type-check
      run: npx tsc --noEmit

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium firefox webkit

    # No Google credentials are given to CI on purpose: Google blocks sign-ins from automated
    # browsers. Without TEST_USER_EMAIL / TEST_USER_PASSWORD the `setup` project (tests/auth.setup.ts)
    # skips itself and the logged-out tests run normally.
    - name: Run Playwright tests
      run: npx playwright test

    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # Traces and screenshots from failed/retried tests (open a trace with `npx playwright show-trace <zip>`).
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: test-results/
        retention-days: 30
